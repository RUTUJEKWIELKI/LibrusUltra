name: Build Librus Ultra release assets

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional existing Release tag (for example, v4.0.3)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  package:
    name: Package Chrome and Firefox extensions
    runs-on: ubuntu-latest
    steps:
      - name: Check out selected revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.release_tag || github.ref }}
          persist-credentials: false

      - name: Validate package versions
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$RELEASE_TAG" ]] && [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must use vMAJOR.MINOR.PATCH, for example v4.0.3." >&2
            exit 1
          fi
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          versions = set()
          for filename in ("manifest.json", "manifest_ff.json"):
              data = json.loads(Path(filename).read_text(encoding="utf-8"))
              version = data.get("version")
              if not isinstance(version, str) or not re.fullmatch(r"\d+\.\d+\.\d+", version):
                  raise SystemExit(f"{filename} has an invalid version: {version!r}.")
              versions.add(version)
          if len(versions) != 1:
              raise SystemExit("Chrome and Firefox manifests must have the same version.")
          version = versions.pop()
          release_tag = os.environ.get("RELEASE_TAG", "")
          if release_tag and version != release_tag[1:]:
              raise SystemExit(f"Manifest version {version} does not match {release_tag}.")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              env.write(f"PACKAGE_VERSION={version}\n")
              env.write(f"RELEASE_TAG={release_tag}\n")
          PY

      - name: Build browser packages
        shell: bash
        run: |
          set -euo pipefail
          version="$PACKAGE_VERSION"
          chrome_stage="$(mktemp -d)"
          firefox_stage="$(mktemp -d)"
          trap 'rm -rf "$chrome_stage" "$firefox_stage"' EXIT

          runtime_files=(
            background.js
            changelog.html
            darkTheme.css
            librus.js
            librusUltra.css
            librusUltra.js
            portal.js
            popup.html
            popup.js
          )

          for file in "${runtime_files[@]}"; do
            test -f "$file"
            cp "$file" "$chrome_stage/"
            cp "$file" "$firefox_stage/"
          done

          cp manifest.json "$chrome_stage/manifest.json"
          cp manifest_ff.json "$firefox_stage/manifest.json"
          cp -R img "$chrome_stage/img"
          cp -R img "$firefox_stage/img"

          mkdir -p "$GITHUB_WORKSPACE/dist"
          (cd "$chrome_stage" && zip -X -qr "$GITHUB_WORKSPACE/dist/Librus-Ultra-Chrome-$version.zip" .)
          (cd "$firefox_stage" && zip -X -qr "$GITHUB_WORKSPACE/dist/Librus-Ultra-Firefox-$version.zip" .)
          unzip -tq "$GITHUB_WORKSPACE/dist/Librus-Ultra-Chrome-$version.zip"
          unzip -tq "$GITHUB_WORKSPACE/dist/Librus-Ultra-Firefox-$version.zip"
          (cd "$GITHUB_WORKSPACE/dist" && sha256sum *.zip > SHA256SUMS.txt)

      - name: Upload manually built ZIPs as workflow artifacts
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: Librus-Ultra-${{ env.PACKAGE_VERSION }}
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7

      - name: Attach packages to the GitHub Release
        if: github.event_name == 'release' || inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        shell: bash
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" >/dev/null
          gh release upload "$RELEASE_TAG" dist/*.zip dist/SHA256SUMS.txt --clobber
